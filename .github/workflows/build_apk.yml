name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Configure google-services.json from Secret
      env:
        GOOGLE_SERVICES_DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        if [ -n "$GOOGLE_SERVICES_DATA" ]; then
          printf '%s\n' "$GOOGLE_SERVICES_DATA" > app/google-services.json
          python3 -c '
          import json
          p = "app/google-services.json"
          pkg = "com.aistudio.timesnap.abxyz"
          with open(p, "r", encoding="utf-8") as f:
              d = json.load(f)
          pid = d.get("project_info", {}).get("project_id")
          clients = d.get("client", [])
          ok = any(x.get("client_info", {}).get("android_client_info", {}).get("package_name") == pkg for x in clients)
          if not ok and clients:
              cloned = json.loads(json.dumps(clients[0]))
              cloned.setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = pkg
              clients.append(cloned)
              d["client"] = clients
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(d, f, indent=2)
              print(f"::warning::Added compatibility client for {pkg} in project {pid}")
          else:
              print(f"Verified google-services.json for project {pid}")
          '
        elif [ ! -f "app/google-services.json" ]; then
          echo "::warning::Secret GOOGLE_SERVICES_JSON is not set! Building with placeholder config — Firebase server login will NOT work until you add GOOGLE_SERVICES_JSON in GitHub Repository Secrets."
          printf '%s\n' '{"project_info":{"project_number":"123456789012","project_id":"timesnap-placeholder","storage_bucket":"timesnap-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890","android_client_info":{"package_name":"com.aistudio.timesnap.abxyz"}},"oauth_client":[],"api_key":[{"current_key":"placeholder-api-key-for-ci"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
        fi

    - name: Configure .env from Secret
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        if [ -n "$GEMINI_KEY" ]; then
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_KEY" > .env
          echo "Configured .env with GEMINI_API_KEY from secret."
        elif [ -f ".env.example" ]; then
          cp .env.example .env
          echo "Copied .env.example to .env."
        else
          touch .env
        fi

    - name: Configure Keystore from Secret
      env:
        KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_DATA" ]; then
          printf '%s' "$KEYSTORE_DATA" | tr -d '\r\n ' | base64 -d > debug.keystore 2>/dev/null || true
          printf '%s' "$KEYSTORE_DATA" | tr -d '\r\n ' | base64 -d > my-upload-key.jks 2>/dev/null || true
          echo "Decoded keystore from secret."
        elif [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          echo "Decoded keystore from local debug.keystore.base64."
        fi
        if [ ! -f "debug.keystore" ]; then
          echo "Generating standard debug.keystore with keytool..."
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "Generated fallback debug.keystore successfully."
        fi
        if [ ! -f "my-upload-key.jks" ]; then
          cp debug.keystore my-upload-key.jks 2>/dev/null || true
        fi

    - name: Build Android APK
      env:
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      run: gradle assembleDebug --stacktrace --no-daemon

    - name: Verify APK output
      run: ls -lh app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK (Zipped Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30

