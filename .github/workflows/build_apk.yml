name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Configure google-services.json from Secret
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          echo "Created app/google-services.json from secret."
        elif [ ! -f "app/google-services.json" ]; then
          echo '{"project_info":{"project_number":"123456789012","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890","android_client_info":{"package_name":"com.aistudio.timesnappro.vklypa"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          echo "Created fallback placeholder app/google-services.json for build."
        fi

    - name: Configure .env from Secret
      run: |
        if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "Configured .env with GEMINI_API_KEY from secret."
        elif [ -f ".env.example" ]; then
          cp .env.example .env
          echo "Copied .env.example to .env."
        else
          touch .env
        fi

    - name: Configure Keystore from Secret
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > debug.keystore || true
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > my-upload-key.jks || true
          echo "Decoded keystore from secret."
        fi

    - name: Build Android APK
      env:
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/**/*.apk

